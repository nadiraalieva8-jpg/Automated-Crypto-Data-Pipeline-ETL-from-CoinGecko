services:
  postgres:
    image: postgres:14.0
    container_name: de-postgres-backend
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"

  airflow-init:
    build: .
    container_name: de-airflow-init
    depends_on:
      - postgres
    command: >
      bash -c "airflow db init && 
      airflow users create --username admin --password admin --firstname Peter --lastname Parker --role Admin --email admin@example.com"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow

  webserver:
    build: .
    container_name: de-airflow-engine
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    environment:
      - LOAD_EXAMPLES=n
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__AUTH__EXPOSE_CONFIG=True
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas sqlalchemy psycopg2-binary boto3 requests
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt # <- MAP THE REQUIREMENTS MATRIX HERE
    ports:
      - "8080:8080"

  scheduler:
    build: .
    container_name: de-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      - LOAD_EXAMPLES=n
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas sqlalchemy psycopg2-binary boto3 requests
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt # <- MAP THE REQUIREMENTS MATRIX HERE

  s3-mock:
    image: localstack/localstack:latest
    container_name: de-aws-s3-mock
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
